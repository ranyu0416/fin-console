# 财务管理台 nginx 反向代理示例（云服务器 / HTTPS）
#
# 用法：
#   sudo cp /opt/fin-console/server/deploy/nginx-fin-console.conf /etc/nginx/conf.d/fin-console.conf
#   把 fin.example.com 换成你的域名，改好证书路径
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书：云服务器有公网域名的话用 certbot 最省事
#   sudo certbot --nginx -d fin.example.com
# 它会自动改写下面的 ssl_certificate 两行并配好自动续期。
#
# 配好 HTTPS 之后，务必把 /etc/fin-console.env 里这两项打开并重启服务：
#   FIN_COOKIE_SECURE=1     否则会话 Cookie 不带 Secure
#   FIN_TRUST_PROXY=1       否则审计日志里每个人的 IP 都是 127.0.0.1
# 顺序不能反：先有 HTTPS 再开 FIN_COOKIE_SECURE，反了谁都登不上。

upstream fin_console {
    server 127.0.0.1:8787;
    keepalive 16;
}

# HTTP 一律跳转 HTTPS（财务数据不要走明文）
server {
    listen 80;
    listen [::]:80;
    server_name fin.example.com;

    # certbot 的 HTTP-01 验证要走明文 80 端口，这一段别跳转
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fin.example.com;

    ssl_certificate     /etc/letsencrypt/live/fin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    # ------------------------------------------------------------------
    # 访问范围。三种情形选一种，别全都放着。
    #
    # 【云服务器 + 公网访问】默认放开（当前状态）。此时这套系统的门只有
    # 登录页一道，所以 HTTPS、强口令、登录限流都必须是开着的。
    #
    # 【只给公司固定 IP 用】强烈推荐，把公网面缩到最小。取消下面注释，
    # 换成你公司出口的公网 IP（不是 192.168 内网段——请求到这里时源地址
    # 已经是公司出口 IP 了）：
    #     allow 203.0.113.45;      # 公司出口固定 IP
    #     allow 127.0.0.1;
    #     deny all;
    #
    # 【走 VPN / 云内网】如果同事通过 VPN 或云内网访问，放行对应网段：
    #     allow 10.0.0.0/8;
    #     allow 172.16.0.0/12;
    #     allow 192.168.0.0/16;
    #     allow 127.0.0.1;
    #     deny all;
    # ------------------------------------------------------------------

    # 与服务端 FIN_MAX_BODY_BYTES 默认的 4 MiB 一致；
    # 调大时必须两边一起改，否则代理和应用会给出互相矛盾的结果。
    client_max_body_size 4m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/fin-console.access.log;
    error_log  /var/log/nginx/fin-console.error.log;

    # ------------------------------------------------------------------
    # X-Forwarded-For 这里刻意用 $remote_addr，而不是常见的
    # $proxy_add_x_forwarded_for。
    #
    # 后者的语义是「保留客户端发来的 XFF，再把真实对端追加到末尾」，
    # 而应用端 clientIp() 取的是**第一个**元素。于是客户端只要自己带一个
    #     X-Forwarded-For: 9.9.9.9
    # 审计日志里记下的就是 9.9.9.9 —— 伪造成功，实测已确认。
    #
    # $remote_addr 是 nginx 从 TCP 连接上读到的对端地址，客户端伪造不了，
    # 而且会整个覆盖掉客户端自带的 XFF。财务系统的审计日志要能追到人，
    # 一个随手就能伪造的 IP 比不记 IP 更糟——它看起来像证据。
    #
    # 如果本机 nginx 前面还有一层云负载均衡（阿里云 SLB、腾讯云 CLB、
    # AWS ELB 等），那一层的地址才是 $remote_addr，需要改成：
    #     set_real_ip_from <负载均衡的网段>;   # 必须写，否则下一行可被伪造
    #     real_ip_header   X-Forwarded-For;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    # set_real_ip_from 是关键：它告诉 nginx「只信任来自这个网段的 XFF」。
    # 不写就等于信任任何人递过来的 XFF，回到可伪造的状态。
    # ------------------------------------------------------------------

    location / {
        proxy_pass http://fin_console;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    # 整套账导出可能耗时较久，单独放宽超时并关掉缓冲
    location /api/export {
        proxy_pass http://fin_console;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # 健康检查：给云负载均衡的探针用，无需登录。
    # 默认不返回任何业务数据（只有 ok 和时间），所以放开是安全的；
    # 但也别把它写进访问日志，探针每 5 秒一次会把日志刷满。
    location = /api/health {
        proxy_pass http://fin_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
